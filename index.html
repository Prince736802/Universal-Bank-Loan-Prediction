<!DOCTYPE html>
<html lang="en">
<head>
  <title>City Shopping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-4">
    <div class="row" id="productList"></div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Become a seller</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Categories</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Mobiles</a></li>
              <li><a class="dropdown-item" href="#">Clothes</a></li>
              <hr class="dropdown-divider">
              <li><a class="dropdown-item" href="#">Furniture</a></li>
              <li><a class="dropdown-item" href="#">Electronics</a></li>
            </ul>
          </li>
        </ul>
        
        <!-- Search Box (aligned properly) -->
        <form class="d-flex flex-grow-1">
          <input class="form-control me-2" type="search" placeholder="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <!-- Fixed Login Button with Dropdown Menu -->
        <li class="nav-item dropdown" id="profile-menu">
          <a class="nav-link dropdown-toggle" href="/login" id="loginDropdown" role="button" data-bs-toggle="dropdown">
            <img src="images/CityShopping.png"  alt="logo" height="40px" width="40px"> Login
          </a>
          <ul class="dropdown-menu dropdown-menu-end p-3">
            <p class="mb-2">New customer? <a href="/login">Sign Up</a></p>
            <hr>
            <a class="dropdown-item" href="#">My Profile</a>
            <a class="dropdown-item" href="#">Orders</a>
            <a class="dropdown-item" href="#">Wishlist</a>
            <a class="dropdown-item" href="#">Rewards</a>
            <a class="dropdown-item" href="#">Gift Cards</a>
          </ul>
        </li>
      </div>
    </div>
  </nav>

  <h1>My Website</h1>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem("username");
      const profileMenu = document.getElementById("profile-menu");

      if (username && profileMenu) {
        profileMenu.innerHTML = `
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
            My Profile
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Orders</a></li>
            <li><a class="dropdown-item" href="#">Account Settings</a></li>
            <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
          </ul>
        `;
      }
    });

    function logout() {
      localStorage.removeItem("username");
      window.location.reload();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
